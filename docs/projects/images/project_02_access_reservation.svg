<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Single-lane workcell access permit</title><desc id="desc">Top-down schematic of a Husky and a fixed Panda coordinating a simplified service task: A stopped Husky requests exclusive lane access while the Panda stays at its safe joint posture.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#2463eb"/></marker><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e7ebf0" stroke-width="1"/></pattern></defs>
<rect width="960" height="540" rx="18" fill="#f5f7fb"/>
<text x="42" y="35" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" fill="#627386">ROBOTICS II · TEAM TASK 02</text>
<text x="42" y="72" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#1c2b3a">Single-lane workcell access permit</text>
<text x="42" y="99" font-family="Arial,sans-serif" font-size="14" fill="#536476">A stopped Husky requests exclusive lane access while the Panda stays at its safe joint posture.</text>
<rect x="42" y="122" width="876" height="304" rx="16" fill="#fff" stroke="#aeb9c5" stroke-width="2"/>
<rect x="54" y="134" width="852" height="280" rx="10" fill="url(#grid)"/>
<g><rect x="300" y="170" width="390" height="210" rx="11" fill="#efbd42" fill-opacity="0.20" stroke="#efbd42" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="495.0" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#314154">EXCLUSIVE ACCESS ZONE</text></g>
<polyline points="170,300 350,300 510,300 690,300" fill="none" stroke="#2463eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><circle cx="350" cy="300" r="18" fill="#68a8f5" stroke="#293b4c" stroke-width="2"/>
      <text x="350" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#182739">STOP</text></g><g><circle cx="510" cy="300" r="18" fill="#f1c84f" stroke="#293b4c" stroke-width="2"/>
      <text x="510" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#182739">GATE</text></g><g><circle cx="690" cy="300" r="18" fill="#75c9a4" stroke="#293b4c" stroke-width="2"/>
      <text x="690" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#182739">CLEAR</text></g>
