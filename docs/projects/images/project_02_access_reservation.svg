<text x="790" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#536476">inspection workbench</text>
<rect x="42" y="444" width="876" height="66" rx="12" fill="#e9eef5"/>
<text x="62" y="470" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#25374a">COORDINATION EVENT</text>
<text x="62" y="492" font-family="Arial,sans-serif" font-size="14" fill="#25374a">Panda safe posture → grant Husky permit → verify clear → resume Panda.</text>
<text x="42" y="530" font-family="Arial,sans-serif" font-size="11" fill="#627386">Concept layout only. Use the repository's Husky, Panda, floor, and primitive SDF geometry; no external assets or sensors are assumed.</text>
