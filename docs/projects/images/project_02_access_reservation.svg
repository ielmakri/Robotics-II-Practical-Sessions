      <rect x="-36" y="-24" width="72" height="48" rx="11" fill="#2463eb"/>
      <circle cx="-24" cy="-27" r="8" fill="#17243a"/><circle cx="24" cy="-27" r="8" fill="#17243a"/>
      <circle cx="-24" cy="27" r="8" fill="#17243a"/><circle cx="24" cy="27" r="8" fill="#17243a"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="white">H</text>
    </g>
<g transform="translate(790 318)" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-70" y="22" width="140" height="44" rx="7" fill="#dae1e9" stroke="#7a8795" stroke-width="2"/>
