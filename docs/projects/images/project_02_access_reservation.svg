      <path d="M0 7 L-18 -24 L13 -47 L-5 -69" fill="none" stroke="#e76b2e" stroke-width="12"/>
      <circle cx="0" cy="7" r="9" fill="#b94c1b"/><circle cx="-18" cy="-24" r="8" fill="#ffd166"/><circle cx="13" cy="-47" r="8" fill="#ffd166"/>
      <path d="M-10 -74 L0 -81 M-10 -74 L-1 -67" fill="none" stroke="#263746" stroke-width="4"/>
