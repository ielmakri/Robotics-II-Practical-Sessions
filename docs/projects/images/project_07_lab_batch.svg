<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Project 07: Laboratory batch handling</title>
<desc id="desc">Schematic of a Husky mobile base carrying a Panda arm for laboratory batch handling. The drawing shows its workcell and the coordinated object flow.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#e08744"/></marker></defs>
<style>
.title{font:700 27px Inter,Arial,sans-serif;fill:#15283d}.sub{font:15px Inter,Arial,sans-serif;fill:#586d83}
.kicker{font:700 12px Inter,Arial,sans-serif;fill:#b65d28;letter-spacing:1.4px}
.label{font:700 13px Inter,Arial,sans-serif;fill:#274055;letter-spacing:.4px}
.small{font:13px Inter,Arial,sans-serif;fill:#607286}.tiny{font:700 10px Inter,Arial,sans-serif;fill:#506779}.dark{fill:#fff}
.card{fill:#fff;stroke:#e0e7ef;stroke-width:1.5}.surface{fill:#f0f5fa;stroke:#cfdae6;stroke-width:2}
.belt{fill:#dce8f2;stroke:#7893ab;stroke-width:2}.roller{fill:#fff;stroke:#8298ab;stroke-width:3}
.cargo{fill:#6bb8cc;stroke:#2e8197;stroke-width:1.5}.cargo2{fill:#f2bd76;stroke:#c77a30;stroke-width:1.5}
.bin{fill:#e6f3f7;stroke:#76b5c2;stroke-width:2}.bin2{fill:#fff1dc;stroke:#e0aa5f;stroke-width:2}
.green{fill:#e4f4ed;stroke:#72b99a;stroke-width:2}.red{fill:#fff0ed;stroke:#dd9484;stroke-width:2}
.drawer{fill:#f8fbfd;stroke:#b7c8d7;stroke-width:1.5}.machine{fill:#34485d;stroke:#20344a;stroke-width:2}.machinewindow{fill:#e5eef5;stroke:#8da3b7;stroke-width:2}
.fixture{fill:#79b7c4;stroke:#357d8c;stroke-width:2}.status{fill:#86d6a3;stroke:#c2f0d3;stroke-width:2}.light{fill:#edf4fa}
.pallet{fill:#c89454;stroke:#956331;stroke-width:2}.rack{fill:#f4f7fa;stroke:#93a9ba;stroke-width:2}.rackline{stroke:#a2b5c4;stroke-width:3}
.tray{fill:#f0f5f8;stroke:#a1b6c6;stroke-width:2}.aircraft{fill:#e3eaf1;stroke:#8fa2b3;stroke-width:2}.wing{fill:#d6e1ea;stroke:#8fa2b3;stroke-width:2}.cone{fill:#f28a43;stroke:#bf5b24;stroke-width:2}.chock{fill:#e4af56;stroke:#a9762c;stroke-width:2}
.slot{fill:#9dc6cf;stroke:#e5f2f4;stroke-width:2}.dash{stroke:#d2803c;stroke-width:2;stroke-dasharray:9 8;fill:none}.arrow{stroke:#e08744;stroke-width:3;fill:none;marker-end:url(#arrow)}
.step{fill:#f3f7fb;stroke:#dbe4ed;stroke-width:1.5}.steptext{font:600 13px Inter,Arial,sans-serif;fill:#42596f}
</style>

<rect width="1200" height="590" rx="28" fill="#f7f9fc"/>
<text x="48" y="47" class="kicker">ROBOTICS II · MULTI-ROBOT TEAM PROJECT 07</text>
<text x="48" y="84" class="title">Laboratory batch handling</text>
<text x="48" y="108" class="sub">Preserve rack identity and priority through instrument loading</text>
<rect x="39" y="132" width="1122" height="340" rx="22" class="card"/>
<rect x="61" y="153" width="259" height="296" rx="18" fill="#eef5fa"/>
<text x="190" y="187" text-anchor="middle" class="label">MOBILE MANIPULATOR</text>

      <g>
        <rect x="104" y="275" width="134" height="54" rx="13" fill="#4b8bb5"/>
        <circle cx="132" cy="334" r="12" fill="#263a4c"/><circle cx="211" cy="334" r="12" fill="#263a4c"/>
