<text x="48" y="84" class="title">Hospital pharmacy replenishment</text>
<text x="48" y="108" class="sub">Restock ward compartments and separate empty returns</text>
<rect x="39" y="132" width="1122" height="340" rx="22" class="card"/>
<rect x="61" y="153" width="259" height="296" rx="18" fill="#eef5fa"/>
