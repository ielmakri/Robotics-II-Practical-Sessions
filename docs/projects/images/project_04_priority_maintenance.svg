<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Priority maintenance dispatch</title><desc id="desc">Top-down schematic of a Husky and a fixed Panda coordinating a simplified service task: Two service requests compete for attention; the high-priority bay is served first.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#2463eb"/></marker><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e7ebf0" stroke-width="1"/></pattern></defs>
<rect width="960" height="540" rx="18" fill="#f5f7fb"/>
<text x="42" y="35" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" fill="#627386">ROBOTICS II · TEAM TASK 04</text>
<text x="42" y="72" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#1c2b3a">Priority maintenance dispatch</text>
<text x="42" y="99" font-family="Arial,sans-serif" font-size="14" fill="#536476">Two service requests compete for attention; the high-priority bay is served first.</text>
