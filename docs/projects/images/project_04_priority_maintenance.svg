      <circle cx="-24" cy="27" r="8" fill="#17243a"/><circle cx="24" cy="27" r="8" fill="#17243a"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="white">H</text>
